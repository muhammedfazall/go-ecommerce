run:
  timeout: 5m
  go: "1.24"

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports



# What is a linter?
# A linter is a tool that reads your code without running it and flags problems
# — bad patterns, missing error checks, messy formatting, unused variables, etc.
# Think of it like spell-check and grammar-check for code.

# What does golangci-lint specifically do?
# It's not one linter — it runs multiple linters at once and combines the results. 
# That's what the config file controls — which linters to enable.

# Here's what each one in your config actually catches:

# Linter      | What it catches                              | Example

# errcheck    - Places where you silently ignore                errorsos.Remove(file) without checking the error
# gosimple    - Overcomplicated code that can be simplified   if x == true instead of if x
# govet       - Suspicious constructs that are probably bugs  Wrong format verbs like fmt.Printf("%d", "hello")
# ineffassign - Variables assigned but never used             x := 5 and then x is never read
# staticcheck - Deeper bugs and deprecated API usage          Calling a function that was removed in newer Go
# unused      - Dead code — functions/types nobody calls      A helper function you wrote but forgot to delete
# gofmt       - Wrong formatting                              Tabs vs spaces, brace placement
# goimports   - Messy import blocks                           Wrong order, missing imports, unused imports


# Why does it exist as a separate file?
# Because golangci-lint has hundreds of available linters and you choose which ones to enforce. 
# The .golangci.yml file at your project root is just your personal ruleset — it tells the tool exactly which checks matter to you.