<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Sneakers | Sneacave</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen p-6">

  <div class="max-w-6xl mx-auto bg-white shadow rounded p-6">

    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold">Sneakers</h1>
      <a href="/admin/dashboard" class="text-sm text-gray-600 hover:underline">
        ← Back to Dashboard
      </a>
    </div>

    <table class="w-full border text-sm">
      <thead class="bg-gray-100">
        <tr>
          <th class="p-2 border">Name</th>
          <th class="p-2 border">Image</th>
          <th class="p-2 border">Brand</th>
          <th class="p-2 border">Gender</th>
          <th class="p-2 border">Price</th>
          <th class="p-2 border">Stock</th>
          <th class="p-2 border">Status</th>
        </tr>
      </thead>
      <tbody id="sneakersTable">
        <tr>
          <td colspan="6" class="p-4 text-center text-gray-500">
            Loading sneakers...
          </td>
        </tr>
      </tbody>
    </table>

  </div>

  <script>
    async function loadSneakers() {
      try {
        const res = await fetch("/admin/sneakers", {
          credentials: "include" // (cookie auth)
        });

        if (!res.ok) {
          throw new Error("Failed to fetch sneakers");
        }

        const sneakers = await res.json();
        const tbody = document.getElementById("sneakersTable");
        tbody.innerHTML = "";

        if (sneakers.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="6" class="p-4 text-center text-gray-500">
                No sneakers found
              </td>
            </tr>`;
          return;
        }

        sneakers.forEach(s => {
          tbody.innerHTML += `
            <tr class="border-t">
              <td class="p-2 border">${s.name}</td>
              <td class="p-2 border">${s.image_url}</td>
              <td class="p-2 border">${s.brand}</td>
              <td class="p-2 border">${s.gender}</td>
              <td class="p-2 border">$${s.price}</td>
              <td class="p-2 border">${s.stock}</td>
              <td class="p-2 border">
                ${s.is_active ? 
                  '<span class="text-green-600">Active</span>' : 
                  '<span class="text-red-600">Hidden</span>'}
              </td>
            </tr>
          `;
        });

      } catch (err) {
        alert(err.message);
      }
    }

    loadSneakers();
  </script>

</body>
</html>
