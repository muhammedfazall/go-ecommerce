<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Login | Sneacave</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gray-100 flex items-center justify-center">

  <div class="w-full max-w-md bg-white shadow-lg rounded-lg p-8">
    
    <h1 class="text-2xl font-bold text-center text-gray-800 mb-2">
      Sneacave Admin
    </h1>
    <p class="text-center text-gray-500 mb-6">
      Login to manage the platform
    </p>

    <!-- error message -->
    {{ if .error }}
    <div class="mb-4 text-sm text-red-600 bg-red-100 border border-red-200 rounded p-3">
      {{ .error }}
    </div>
    {{ end }}

    <form
      action="/admin/login"
      method="POST"
      class="space-y-4"
    >
      
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Email
        </label>
        <input
          type="email"
          name="email"
          required
          class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-black"
          placeholder="admin@sneacave.com"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Password
        </label>
        <input
          type="password"
          name="password"
          required
          class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-black"
          placeholder="••••••••"
        />
      </div>

      <button
        type="submit"
        class="w-full bg-black text-white py-2 rounded hover:bg-gray-900 transition">
        Login
      </button>

    </form>

    <p class="mt-6 text-center text-xs text-gray-400">
      © Sneacave Admin Panel
    </p>
  </div>

</body>
</html>
