<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Admin Dashboard | Sneacave</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex">

  <!-- ================= SIDEBAR ================= -->
  <aside class="w-64 bg-black text-white flex flex-col">
    <div class="p-6 text-xl font-bold border-b border-gray-700">
      Sneacave Admin
    </div>

    <nav class="flex-1 p-4 space-y-2">
      <button onclick="loadDashboard()" class="w-full text-left px-4 py-2 rounded bg-gray-800">
        Dashboard
      </button>

      <button onclick="loadSneakers()" class="w-full text-left px-4 py-2 rounded hover:bg-gray-800">
        Sneakers
      </button>

      <button class="w-full text-left px-4 py-2 rounded hover:bg-gray-800">
        Users
      </button>

      <button class="w-full text-left px-4 py-2 rounded hover:bg-gray-800">
        Orders
      </button>
    </nav>

    <form action="/admin/logout" method="POST" class="p-4 border-t border-gray-700">
      <button class="w-full text-left px-4 py-2 rounded hover:bg-red-600">
        Logout
      </button>
    </form>
  </aside>

  <!-- ================= MAIN CONTENT ================= -->
  <main class="flex-1 p-6">
    <div id="content"></div>
  </main>

  <!-- ================= IMAGE PREVIEW MODAL ================= -->
  <div id="imgModal" class="fixed inset-0 z-50 hidden bg-black/70 flex items-center justify-center">
    <img id="modalImg" class="max-w-[90vw] max-h-[90vh] object-contain rounded-lg shadow-xl" />
  </div>

  <!-- ================= ADD / EDIT SNEAKER MODAL ================= -->
  <div id="sneakerModal" class="fixed inset-0 hidden bg-black/50 flex items-center justify-center">

    <div class="bg-white w-full max-w-lg rounded shadow p-6">
      <div class="flex justify-between items-center mb-4">
        <h2 id="modalTitle" class="text-xl font-bold">Add Sneaker</h2>
        <button onclick="closeModal()" class="text-gray-500 hover:text-black">✕</button>
      </div>

      <form id="sneakerForm" class="space-y-3">
        <input name="name" placeholder="Name" class="w-full border p-2 rounded" required />
        <input name="brand" placeholder="Brand" class="w-full border p-2 rounded" required />
        <select name="category_id" id="categorySelect" class="w-full border p-2 rounded" required>
          <option value="">Select category</option>
        </select>

        <select name="gender" class="w-full border p-2 rounded">
          <option value="men">Men</option>
          <option value="women">Women</option>
          <option value="unisex">Unisex</option>
        </select>

        <textarea name="description" placeholder="Description" class="w-full border p-2 rounded"></textarea>

        <input name="price" type="number" step="0.01" placeholder="Price" class="w-full border p-2 rounded" required />

        <input name="stock" type="number" placeholder="Stock" class="w-full border p-2 rounded" required />

        <input name="image_url" placeholder="Image URL" class="w-full border p-2 rounded" />

        <div class="flex justify-end gap-2 pt-4">
          <button type="button" onclick="closeModal()" class="px-4 py-2 border rounded">
            Cancel
          </button>
          <button type="submit" class="px-4 py-2 bg-black text-white rounded">
            Save
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- ================= SCRIPTS ================= -->
  <script>
    let editingSneakerId = null;
    let categoriesCache = [];

    document.addEventListener("DOMContentLoaded", () => {
      loadDashboard();

      // Image modal close
      document.addEventListener("click", (e) => {
        if (e.target.id === "imgModal") {
          document.getElementById("imgModal").classList.add("hidden");
        }
      });

      // Form submit
      document.getElementById("sneakerForm")
        .addEventListener("submit", submitSneakerForm);
    });

    // ---------- DASHBOARD ----------
    window.loadDashboard = function () {
      document.getElementById("content").innerHTML = `
        <h1 class="text-2xl font-bold mb-4">Dashboard</h1>
        <p class="text-gray-600">Welcome to Sneacave admin panel.</p>
      `;
    };

    // ---------- SNEAKERS ----------
    window.loadSneakers = async function () {
      const content = document.getElementById("content");
      content.innerHTML = "<p>Loading sneakers...</p>";

      const res = await fetch("/admin/sneakers", { credentials: "include" });
      const sneakers = await res.json();

      const rows = sneakers.map(s => `
        <tr class="border-t">
          <td class="p-2 border">${s.name}</td>
          <td class="p-2 border text-center">
            <img src="${s.image_url}"
                 class="h-16 w-16 object-cover mx-auto cursor-pointer"
                 onclick="openImage('${s.image_url}')" />
          </td>
          <td class="p-2 border">${s.brand}</td>
          <td class="p-2 border">${s.gender}</td>
          <td class="p-2 border">$${s.price}</td>
          <td class="p-2 border">${s.stock}</td>
          <td class="p-2 border">
            ${s.is_active ? 'Active' : 'Hidden'}
          </td>
          <td class="p-2 border text-center space-x-2">
            <button onclick="editSneaker(${s.id})"
                    class="text-blue-600 hover:underline">Edit</button>
            <button onclick="deleteSneaker(${s.id})"
                    class="text-red-600 hover:underline">Delete</button>
          </td>
        </tr>
      `).join("");

      content.innerHTML = `
        <div class="flex justify-between items-center mb-4">
          <h1 class="text-2xl font-bold">Sneakers</h1>
          <button onclick="openModal()"
                  class="bg-black text-white px-4 py-2 rounded">
            + Add Sneaker
          </button>
        </div>

        <table class="w-full border text-sm">
          <thead class="bg-gray-100">
            <tr>
              <th class="p-2 border">Name</th>
              <th class="p-2 border">Image</th>
              <th class="p-2 border">Brand</th>
              <th class="p-2 border">Gender</th>
              <th class="p-2 border">Price</th>
              <th class="p-2 border">Stock</th>
              <th class="p-2 border">Status</th>
              <th class="p-2 border">Actions</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    };

    // ---------- MODALS ----------

    async function loadCategories() {
      const res = await fetch("/admin/categories", {
        credentials: "include"
      });

     
  const data = await res.json();
  console.log("CATEGORIES FROM API 👉", data);

      categoriesCache = data;
    }

    window.deleteSneaker = async function (id) {
      if (!confirm("Delete this sneaker?")) return;
      await fetch(`/admin/sneakers/${id}`, {
        method: "DELETE",
        credentials: "include"
      });
      loadSneakers();
    };


    window.openModal = async function () {
      editingSneakerId = null;
      document.getElementById("modalTitle").innerText = "Add Sneaker";
      document.getElementById("sneakerForm").reset();

      if (categoriesCache.length === 0) {
        await loadCategories();
      }

      const select = document.getElementById("categorySelect");
select.innerHTML = "";

categoriesCache.forEach(cat => {
  console.log("ADDING OPTION 👉", cat);

  const opt = document.createElement("option");
  opt.value = String(cat.id);
  opt.textContent = cat.name;
  select.appendChild(opt);
});


      document.getElementById("sneakerModal").classList.remove("hidden");
    };


    window.closeModal = function () {
      editingSneakerId = null;
      document.getElementById("sneakerModal").classList.add("hidden");
    };

    window.openImage = function (src) {
      document.getElementById("modalImg").src = src;
      document.getElementById("imgModal").classList.remove("hidden");
    };

    // ---------- ACTIONS ----------
    async function submitSneakerForm(e) {
      e.preventDefault();

      const data = Object.fromEntries(new FormData(e.target));
      data.price = parseFloat(data.price);
      data.stock = parseInt(data.stock);
      data.category_id = parseInt(data.category_id);

      const url = editingSneakerId
        ? `/admin/sneakers/${editingSneakerId}`
        : `/admin/sneakers`;

      const method = editingSneakerId ? "PUT" : "POST";

      await fetch(url, {
        method,
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });

      closeModal();
      loadSneakers();
    }

    window.editSneaker = async function (id) {
      const res = await fetch("/admin/sneakers", { credentials: "include" });
      const sneakers = await res.json();
      const sneaker = sneakers.find(s => s.id === id);
      
      if (!sneaker) return;
      
      editingSneakerId = id;
      document.getElementById("modalTitle").innerText = "Edit Sneaker";

      if (categoriesCache.length === 0) {
        await loadCategories();
      }

      const select = document.getElementById("categorySelect");
      select.innerHTML = `<option value="">Select category</option>`;

      categoriesCache.forEach(cat => {
    const option = document.createElement("option");
    option.value = String(cat.id);
    option.textContent = cat.name;
    select.appendChild(option);
  });

  // ✅ Now set selected category
  select.value = String(sneaker.category_id);

  //fill other fields
      Object.keys(sneaker).forEach(key => {
        const field = document.querySelector(`[name="${key}"]`);
        if (field && key !== "category_id"){

          field.value = sneaker[key];
        }
      });

      document.getElementById("sneakerModal").classList.remove("hidden");
    };
  </script>

</body>

</html>
