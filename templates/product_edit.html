{{define "title"}}Edit Product{{end}}

{{define "content"}}
<h1 class="text-2xl font-bold mb-6">Edit Sneaker</h1>

{{if .Error}}
  <p class="text-red-600 mb-4">{{.Error}}</p>
{{end}}

<form method="POST"
      action="/admin/products/{{.Sneaker.ID}}/edit"
      class="space-y-4 max-w-lg">

  <div>
    <label class="block">Name</label>
    <input name="name"
           value="{{.Sneaker.Name}}"
           class="border p-2 w-full" required />
  </div>

  <div>
    <label class="block">Brand</label>
    <input name="brand"
           value="{{.Sneaker.Brand}}"
           class="border p-2 w-full" required />
  </div>

  <div>
    <label class="block">Gender</label>
    <select name="gender" class="border p-2 w-full">
      <option value="men" {{if eq .Sneaker.Gender "men"}}selected{{end}}>Men</option>
      <option value="women" {{if eq .Sneaker.Gender "women"}}selected{{end}}>Women</option>
      <option value="unisex" {{if eq .Sneaker.Gender "unisex"}}selected{{end}}>Unisex</option>
    </select>
  </div>

  <div>
    <label class="block">Price</label>
    <input type="number"
           step="0.01"
           name="price"
           value="{{.Sneaker.Price}}"
           class="border p-2 w-full" required />
  </div>

  <div>
    <label class="block">Stock</label>
    <input type="number"
           name="stock"
           value="{{.Sneaker.Stock}}"
           class="border p-2 w-full" required />
  </div>

  <div>
    <label class="block">Image URL</label>
    <input name="image_url"
           value="{{.Sneaker.ImageURL}}"
           class="border p-2 w-full" />
  </div>

  <div class="flex items-center space-x-2">
    <input type="checkbox"
           name="is_active"
           {{if .Sneaker.IsActive}}checked{{end}} />
    <label>Active</label>
  </div>

  <div class="flex space-x-4">
    <button class="bg-black text-white px-4 py-2">
      Update Product
    </button>

    <a href="/admin/products"
       class="px-4 py-2 border">
      Cancel
    </a>
  </div>
</form>
{{end}}
