{{define "title"}}Add Product{{end}}

{{define "content"}}
<h1 class="text-2xl font-bold mb-6">Add New Sneaker</h1>

{{if .Error}}
  <p class="text-red-600 mb-4">{{.Error}}</p>
{{end}}

<form method="POST"
      action="/admin/products/new"
      class="space-y-4 max-w-lg">

  <div>
    <label class="block">Name</label>
    <input name="name"
           class="border p-2 w-full"
           required />
  </div>

  <div>
    <label class="block">Brand</label>
    <input name="brand"
           class="border p-2 w-full"
           required />
  </div>

  <div>
    <label class="block">Gender</label>
    <select name="gender" class="border p-2 w-full">
      <option value="men">Men</option>
      <option value="women">Women</option>
      <option value="unisex">Unisex</option>
    </select>
  </div>

  <div>
    <label class="block">Price</label>
    <input type="number"
           step="0.01"
           name="price"
           class="border p-2 w-full"
           required />
  </div>

  <div>
    <label class="block">Stock</label>
    <input type="number"
           name="stock"
           class="border p-2 w-full"
           required />
  </div>

  <div>
    <label class="block">Image URL</label>
    <input name="image_url"
           class="border p-2 w-full" />
  </div>

  <div class="flex space-x-4">
    <button class="bg-black text-white px-4 py-2">
      Add Product
    </button>

    <a href="/admin/products"
       class="px-4 py-2 border">
      Cancel
    </a>
  </div>
</form>
{{end}}
