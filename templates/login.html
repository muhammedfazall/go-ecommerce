<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sneacave | Admin</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
              800: '#166534',
              900: '#14532d',
            }
          },
          animation: {
            'fade-in': 'fadeIn 0.5s ease-in-out',
            'slide-in': 'slideIn 0.3s ease-out',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideIn: {
              '0%': { transform: 'translateY(10px)', opacity: '0' },
              '100%': { transform: 'translateY(0)', opacity: '1' },
            }
          }
        }
      }
    }
  </script>
</head>

<body class="bg-primary-50 min-h-screen flex items-center justify-center">

  <div class="bg-white w-full max-w-sm p-8 rounded-xl shadow-lg
              animate-fade-in animate-slide-in">

    <h1 class="text-4xl font-bold text-center text-primary-700 mb-6">
      Sneacave Admin
    </h1>

    <form method="POST" action="/admin/login" class="space-y-5">

      <!-- Email -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Email
        </label>
        <input
          type="email"
          name="email"
          required
          class="w-full px-3 py-2 border rounded-lg
                 focus:outline-none focus:ring-2 focus:ring-primary-500
                 focus:border-primary-500"
        />
      </div>

      <!-- Password -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Password
        </label>
        <input
          type="password"
          name="password"
          required
          class="w-full px-3 py-2 border rounded-lg
                 focus:outline-none focus:ring-2 focus:ring-primary-500
                 focus:border-primary-500"
        />
      </div>

      <!-- Error Message -->
      {{if .Error}}
        <p class="text-sm text-red-600 bg-red-50 border border-red-200 rounded-md px-3 py-2">
          {{.Error}}
        </p>
      {{end}}

      <!-- Submit Button -->
      <button
        type="submit"
        class="w-full bg-primary-600 text-white py-2.5 rounded-lg
               font-semibold hover:bg-primary-700
               transition duration-200">
        Login
      </button>

    </form>
  </div>

</body>
</html>
