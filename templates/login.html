<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Login</title>
  <link href="/static/output.css" rel="stylesheet">
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

  <div class="bg-white p-8 rounded shadow-md w-full max-w-sm">
    <h1 class="text-2xl font-bold mb-4 text-center">Admin Login</h1>

    <form method="POST" action="/admin/login" class="space-y-4">
      <div>
        <label>Email</label>
        <input name="email" class="border p-2 w-full" />
      </div>

      <div>
        <label>Password</label>
        <input type="password" name="password" class="border p-2 w-full" />
      </div>

      {{if .Error}}
        <p class="text-red-600 text-sm">{{.Error}}</p>
      {{end}}

      <button class="bg-black text-white px-4 py-2 w-full">
        Login
      </button>
    </form>
  </div>

</body>
</html>
