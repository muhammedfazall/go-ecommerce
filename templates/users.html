{{define "title"}}Users{{end}}

{{define "content"}}
<h1 class="text-2xl font-bold mb-4">Users</h1>

<table class="w-full border text-sm">
  <thead>
    <tr>
      <th class="border p-2">ID</th>
      <th class="border p-2">Username</th>
      <th class="border p-2">Email</th>
      <th class="border p-2">Role</th>
      <th class="border p-2">Status</th>
      <th class="border p-2">Blocked</th>
      <th class="border p-2">Created At</th>
    </tr>
  </thead>

  <tbody>
    {{range .Users}}
      <tr>
        <td class="border p-2">{{.ID}}</td>
        <td class="border p-2">{{.Username}}</td>
        <td class="border p-2">{{.Email}}</td>
        <td class="border p-2">{{.Role}}</td>
        <td class="border p-2">{{.Status}}</td>
        <td class="border p-2">
          {{if .IsBlocked}}
            <span class="text-red-600 font-semibold">Yes</span>
          {{else}}
            <span class="text-green-600 font-semibold">No</span>
          {{end}}
        </td>
        <td class="border p-2">
          {{.CreatedAt.Format "02 Jan 2006"}}
        </td>
      </tr>
    {{else}}
      <tr>
        <td colspan="7" class="border p-4 text-center">
          No users found
        </td>
      </tr>
    {{end}}
  </tbody>
</table>
{{end}}
