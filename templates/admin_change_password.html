{{define "title"}}Change Password{{end}}

{{define "content"}}

<!-- Page Header -->
<div class="mb-8">
  <h1 class="text-3xl font-bold text-gray-800">Change Password</h1>
  <p class="text-gray-500 mt-1">Update your admin account password</p>
</div>

<!-- Error Message -->
{{if .error}}
<div class="mb-6 bg-red-100 border border-red-300 text-red-700 px-4 py-3 rounded-lg">
  {{.error}}
</div>
{{end}}

<!-- Change Password Form -->
<div class="bg-white rounded-xl shadow p-6 max-w-xl">

  <form method="POST" action="/admin/password-change" class="space-y-6">

    <!-- Current Password -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Current Password
      </label>
      <input
        type="password"
        name="current_password"
        class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-primary-500 focus:outline-none"
        required
      />
    </div>

    <!-- New Password -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        New Password
      </label>
      <input
        type="password"
        name="new_password"
        class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-primary-500 focus:outline-none"
        required
      />
    </div>

    <!-- Confirm Password -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Confirm New Password
      </label>
      <input
        type="password"
        name="confirm_password"
        class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-primary-500 focus:outline-none"
        required
      />
    </div>

    <!-- Actions -->
    <div class="flex gap-4">
      <button
        type="submit"
        class="bg-primary-600 text-white px-6 py-2 rounded-lg hover:bg-primary-700 transition"
      >
        Update Password
      </button>

      <a
        href="/admin/profile"
        class="px-6 py-2 rounded-lg border text-gray-700 hover:bg-gray-100 transition"
      >
        Cancel
      </a>
    </div>

  </form>

</div>

{{end}}
