{{define "title"}}Orders{{end}}

{{define "content"}}
<h1 class="text-3xl font-bold mb-6">Orders</h1>

<div class="bg-white rounded-xl shadow overflow-hidden">


    <form method="GET" action="/admin/orders" class="bg-white p-4 rounded-xl shadow mb-6 flex flex-wrap gap-4 items-end">

  <!-- Status Filter -->
  <div>
    <label class="block text-sm font-medium mb-1">Status</label>
    <select name="status" class="border rounded-lg px-3 py-2">
      <option value="">All</option>
      <option value="pending" {{if eq .FilterStatus "pending"}}selected{{end}}>Pending</option>
      <option value="paid" {{if eq .FilterStatus "paid"}}selected{{end}}>Paid</option>
      <option value="shipped" {{if eq .FilterStatus "shipped"}}selected{{end}}>Shipped</option>
      <option value="delivered" {{if eq .FilterStatus "delivered"}}selected{{end}}>Delivered</option>
      <option value="cancelled" {{if eq .FilterStatus "cancelled"}}selected{{end}}>Cancelled</option>
    </select>
  </div>

  <!-- From Date -->
  <div>
    <label class="block text-sm font-medium mb-1">From</label>
    <input type="date" name="from" value="{{.FromDate}}" class="border rounded-lg px-3 py-2">
  </div>

  <!-- To Date -->
  <div>
    <label class="block text-sm font-medium mb-1">To</label>
    <input type="date" name="to" value="{{.ToDate}}" class="border rounded-lg px-3 py-2">
  </div>

  <!-- Submit -->
  <div>
    <button class="bg-primary-600 text-white px-6 py-2 rounded-lg">
      Filter
    </button>
  </div>

  <!-- Reset -->
  <div>
    <a href="/admin/orders" class="text-sm text-gray-600 underline">
      Reset
    </a>
  </div>

</form>



  <table class="min-w-full text-sm">
    <thead class="bg-gray-100 text-gray-700">
      <tr>
        <th class="px-6 py-3 text-left">Order ID</th>
        <th class="px-6 py-3 text-left">User</th>
        <th class="px-6 py-3 text-left">Total</th>
        <th class="px-6 py-3 text-left">Status</th>
        <th class="px-6 py-3 text-left">Date</th>
        <th class="px-6 py-3"></th>
      </tr>
    </thead>
    <tbody>
      {{range .Orders}}
      <tr class="border-t">
        <td class="px-6 py-4">#{{.ID}}</td>
        <td class="px-6 py-4">{{.User.Email}}</td>
        <td class="px-6 py-4">₹{{printf "%.2f" .TotalAmount}}</td>
        <td class="px-6 py-4">
          <span class="px-3 py-1 rounded-full text-xs
            {{if eq .Status "pending"}}bg-yellow-100 text-yellow-700{{end}}
            {{if eq .Status "paid"}}bg-blue-100 text-blue-700{{end}}
            {{if eq .Status "shipped"}}bg-purple-100 text-purple-700{{end}}
            {{if eq .Status "delivered"}}bg-green-100 text-green-700{{end}}
            {{if eq .Status "cancelled"}}bg-red-100 text-red-700{{end}}">
            {{.Status}}
          </span>
        </td>
        <td class="px-6 py-4">{{.CreatedAt.Format "02 Jan 2006"}}</td>
        <td class="px-6 py-4 text-right">
          <a href="/admin/orders/{{.ID}}" class="text-primary-600 font-medium hover:underline">
            View
          </a>
        </td>
      </tr>
      {{end}}
    </tbody>
  </table>
</div>
{{end}}
